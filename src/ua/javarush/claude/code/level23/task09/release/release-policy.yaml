# Політика релізу для refund-service
# Версія релізу: v2.31.0
#
# УВАГА: policy поки не відображає deployment boundary.
# Розгортання в production дозволено занадто вільно, список notDelegated неповний.

version: v2.31.0
service: refund-service

actions:
  productionDeploy:
    # розгортання в production лише з підтвердженням людиною
    approval: human-approved-only
  secretRotation:
    approval: human-approved-only

requiredChecks:
  - CI
  - staging smoke

notDelegated:
  - db-migration
  - force-push