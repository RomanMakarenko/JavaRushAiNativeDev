# Ізольоване середовище для міграційних експериментів.
services:
  app-test:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: test

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data