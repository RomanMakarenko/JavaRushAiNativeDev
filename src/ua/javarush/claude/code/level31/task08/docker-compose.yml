services:
  api:
    build: .
    image: demo-ready-api:local
    container_name: demo-ready-api
    ports:
      - "8080:8000"
    env_file:
      - .env.example
    environment:
      # Demo mode використовує безпечні placeholder-значення з .env.example.
      APP_ENV: ${APP_ENV:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/demo.db}
      API_TOKEN: ${API_TOKEN:-demo-token-placeholder}
    restart: unless-stopped