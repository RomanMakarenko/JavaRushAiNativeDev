name: pr-checks
# Deterministic checks (blocking) та AI review (advisory) для Commerce OS.
on:
  pull_request:
    branches: [main]

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        run: ./gradlew test

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run secret:scan

  ai-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: AI review
        run: bash scripts/run-ai-review.sh