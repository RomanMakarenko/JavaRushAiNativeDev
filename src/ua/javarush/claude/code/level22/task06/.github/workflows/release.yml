name: release

# Межа artifact vs action:
# - draft (artifact): збирає notes на кожен push у main, нічого не тегає і не публікує;
# - publish (action): тег і release створюються лише вручну через workflow_dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build draft release notes
        run: bash scripts/draft-release-notes.sh > DRAFT_NOTES.md

      - name: Upload draft notes
        uses: actions/upload-artifact@v4
        with:
          name: draft-notes
          path: DRAFT_NOTES.md

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: draft
    steps:
      - uses: actions/checkout@v4

      - name: Download draft notes
        uses: actions/download-artifact@v4
        with:
          name: draft-notes
          path: .

      - name: Create tag
        run: |
          git tag "v$(cat VERSION.txt)"
          git push origin "v$(cat VERSION.txt)"

      - name: Publish release
        run: gh release create "v$(cat VERSION.txt)" --notes-file DRAFT_NOTES.md