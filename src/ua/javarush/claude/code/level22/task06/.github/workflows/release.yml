name: release

# Початковий стан (небезпечний):
# на кожен push у main workflow одразу збирає notes, ставить tag і публікує release.
# Немає межі між release artifact і release action.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build draft release notes
        run: bash scripts/draft-release-notes.sh > DRAFT_NOTES.md

      - name: Create tag
        run: |
          git tag "v$(cat VERSION.txt)"
          git push origin "v$(cat VERSION.txt)"

      - name: Publish release
        run: gh release create "v$(cat VERSION.txt)" --notes-file DRAFT_NOTES.md