# Конфігурація legacy CashFlow Dashboard
app.name=cashflow-dashboard

# Налаштування MRR-движка
mrr.engine.pause.freeze-amount=true
mrr.engine.currency=USD

# Налаштування платіжного провайдера
payments.provider.key=${PAYMENTS_PROVIDER_KEY}
payments.webhook.secret=${PAYMENTS_WEBHOOK_SECRET}
payments.retry.max-attempts=3