# Політика використання AI в тестових завданнях
# Невизначена або порожня policy завжди потребує уточнення.

statuses:
  forbidden: "Не використовувати AI; розв'язувати завдання повністю самостійно"
  allowed-with-disclosure: "Можна використовувати AI, але потрібно розкрити факт і спосіб використання"
  ask-first: "Спочатку запитати дозвіл або уточнити умови використання AI"

# Що робити, якщо у вакансії policy не вказано або вона порожня
default_when_unknown: ask-first