# Політика використання AI в тестових завданнях
# УВАГА: поточний конфіг трактує невідомий статус як allowed.

statuses:
  forbidden: "Не використовувати AI; розв'язувати завдання повністю самостійно"
  allowed: "Можна використовувати будь-який AI без обмежень"

# Що робити, якщо у вакансії policy не вказано
default_when_unknown: allowed