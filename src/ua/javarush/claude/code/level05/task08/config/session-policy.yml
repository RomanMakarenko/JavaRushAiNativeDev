# Політика робочих session для auth-багфікса
project: payments-auth
owner: platform-team

# --- session hygiene ---
# Одна задача за раз (чиста сесія).
allowMixedTasks: false
# Відхилені гіпотези очищуються з контексту.
keepRejectedHypothesesActive: false
# У разі плутанини — вузький recovery-first підхід, не додавати контексту.
preferMoreContextWhenConfused: false
preferredRecoveryAction: restart-session

# --- інші налаштування (не належать до session hygiene) ---
defaultBranch: main
maxLogTailLines: 200
notifyChannel: "#payments-auth"