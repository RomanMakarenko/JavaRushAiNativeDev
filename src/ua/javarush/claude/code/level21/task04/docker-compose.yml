services:
  backend:
    build: .
    image: payments-backend:local
    ports:
      - "8081:8080"
    environment:
      - APP_PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=payments
      - DB_USER=payments
      - DB_PASSWORD=changeme
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=payments
      - POSTGRES_PASSWORD=changeme
    ports:
      - "5432:5432"