# Перевірка Pull Request у гілку main.
# Один job: запуск тестів проєкту через Gradle.
# Жодних прав на запис, merge чи коментарі в PR не виконуються.
name: PR Check

on:
  pull_request:
    branches: [ main ]

permissions:
  # Мінімальні права: лише читання вмісту репозиторію для checkout.
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: ./gradlew test