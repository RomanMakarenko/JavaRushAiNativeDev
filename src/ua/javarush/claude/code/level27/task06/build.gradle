plugins {
    id 'java'
}

group = 'com.acme.cashflow'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // доступ до даних для legacy-модуля mrr-engine
    implementation 'org.springframework:spring-jdbc:5.3.31'

    // тести
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

test {
    useJUnitPlatform()
}