plugins {
    id 'java'
}

group = 'com.acme.cashflow'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Тестовий стек уже підключено. Нові залежності додавати не можна.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}