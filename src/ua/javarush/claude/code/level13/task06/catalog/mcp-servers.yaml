# Каталог зовнішніх MCP-серверів Commerce OS.
# Приведено до суворої форми: category, read_only_tools / write_tools.
servers:
  - name: issue-tracker
    category: issue-tracker
    read_only_tools:
      - get_issue
      - list_issues
    write_tools:
      - create_issue
      - update_issue

  - name: pr-review
    category: source-control
    read_only_tools:
      - get_pull_request
      - get_diff
    write_tools:
      - post_comment
      - merge_pull_request

  - name: docs-lookup
    category: docs-lookup
    read_only_tools:
      - search_docs
      - get_doc_page
    write_tools: []